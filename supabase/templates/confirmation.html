<!--
  Signup confirmation - 6-digit OTP.

  {{ .Token }} deliberately, not {{ .ConfirmationURL }}. The app has no deep
  link handlers on any platform; the code is typed into /verify-email instead.

  Table layout and inline styles because email clients are not browsers:
  Gmail strips <style> blocks, Outlook ignores flexbox and most of the box
  model. Keep any edits inside this idiom.
-->
<table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#F8FAFC;padding:32px 16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <tr>
    <td align="center">
      <table width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:480px;background-color:#FFFFFF;border-radius:16px;padding:40px 32px;">

        <tr>
          <td align="center" style="padding-bottom:8px;font-size:24px;font-weight:700;letter-spacing:2px;color:#2563EB;">
            KASBON
          </td>
        </tr>
        <tr>
          <td align="center" style="padding-bottom:32px;font-size:14px;color:#64748B;">
            Kasir Bisnis Online
          </td>
        </tr>

        <tr>
          <td align="center" style="padding-bottom:8px;font-size:20px;font-weight:600;color:#0F172A;">
            Verifikasi email Anda
          </td>
        </tr>
        <tr>
          <td align="center" style="padding-bottom:28px;font-size:15px;line-height:22px;color:#475569;">
            Masukkan kode ini di aplikasi KASBON untuk menyelesaikan pendaftaran.
          </td>
        </tr>

        <tr>
          <td align="center" style="padding-bottom:28px;">
            <table cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td align="center" style="background-color:#DBEAFE;border-radius:12px;padding:20px 36px;font-size:34px;font-weight:700;letter-spacing:10px;color:#1D4ED8;font-family:'SF Mono',Menlo,Consolas,monospace;">
                  {{ .Token }}
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <tr>
          <td align="center" style="padding-bottom:32px;font-size:14px;color:#64748B;">
            Kode ini berlaku selama <strong style="color:#475569;">15 menit</strong>.
          </td>
        </tr>

        <tr>
          <td style="border-top:1px solid #E2E8F0;padding-top:24px;font-size:13px;line-height:20px;color:#94A3B8;">
            Jika Anda tidak membuat akun KASBON, abaikan email ini &mdash; tidak
            ada akun yang akan dibuat tanpa kode di atas.
          </td>
        </tr>

      </table>
    </td>
  </tr>
</table>
