name: kasbon_pos
description: "Kasir Digital untuk UMKM Indonesia - cloud POS powered by Supabase"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Path URL strategy on web (no #/ in the address bar). See
  # config/routes/url_strategy_web.dart.
  flutter_web_plugins:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Cloud Database (Supabase)
  supabase_flutter: ^2.8.0
  path_provider: ^2.1.1
  path: ^1.8.3

  # Local Storage (Settings, Cache)
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2

  # Dependency Injection
  get_it: ^7.6.4

  # Navigation
  go_router: ^12.1.1

  # UI Components
  fl_chart: ^0.65.0
  shimmer: ^3.0.0
  flutter_slidable: ^3.0.1

  # Utilities
  intl: ^0.20.2
  uuid: ^4.2.1
  equatable: ^2.0.5
  dartz: ^0.10.1
  logger: ^2.0.2

  # Sharing
  share_plus: ^7.2.1
  url_launcher: ^6.2.2
  package_info_plus: ^8.0.0

  # File Picker (for backup restore)
  file_picker: ^8.0.0

  # Report export (Excel / PDF)
  # NOTE: TASK_019 specified excel ^3.0.0, but 3.0.0's Sheet.delete/rename call
  # removeWhere on archive's file list, which archive >=3.6.0 exposes as an
  # UnmodifiableListView - it throws at runtime. 4.x targets archive ^3.6.1.
  excel: ^4.0.6
  pdf: ^3.10.7
  printing: ^5.11.1

  # Image handling
  image_picker: ^1.0.7
  flutter_image_compress: ^2.1.0
  permission_handler: ^11.3.0
  # Pure-Dart decode/resize/encode. The browser has no compression plugin worth
  # using, and image_picker_for_web ignores maxWidth/imageQuality entirely, so
  # without this the web build uploads the camera's original file.
  image: ^4.2.0

  # Browser APIs (Blob, anchor download) for file export on web. Not used
  # outside lib/**_web.dart - see core/services/file_export/.
  web: ^1.0.0
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.2

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  # Code Generation
  build_runner: ^2.4.6
  riverpod_generator: ^2.3.9
  freezed: ^2.4.5
  freezed_annotation: ^2.4.1
  json_serializable: ^6.7.1

  # Testing
  mocktail: ^1.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/sample_data/

  # Plus Jakarta Sans (SIL Open Font License 1.1 - see assets/fonts/OFL.txt).
  # Bundled rather than fetched at runtime so first paint never flashes a
  # fallback font. Italics are intentionally omitted - the app never uses them.
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
