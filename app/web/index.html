<!DOCTYPE html>
<html lang="id">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!-- Content-Security-Policy.
       ================================================================
       Only the directives that do not depend on where the app is deployed are
       here. That is a deliberate limit, not an oversight: a <meta> CSP is baked
       into the bundle at build time, while the Supabase origin the app talks to
       is 127.0.0.1 in local dev, 10.0.2.2 in the emulator and a project
       subdomain in production. Pinning `connect-src` here would either break
       dev or be loosened to `https:` until it meant nothing. Directives left
       unlisted are unrestricted - there is intentionally no `default-src` - so
       omitting them costs nothing that listing them loosely would have gained.

       `script-src` is the one that matters against injection and it is the same
       everywhere: same-origin scripts only, plus the wasm compilation Flutter's
       CanvasKit renderer needs, plus the gstatic CDN the engine loads CanvasKit
       from by default. Building with --no-web-resources-cdn bundles CanvasKit
       locally and lets the gstatic entry go.

       There is no 'unsafe-inline' for scripts, which is why the splash-removal
       handler lives in splash.js. It is present for styles, where the inline
       block has to paint before any request could return.

       STILL REQUIRED AT THE HOST, because a <meta> tag cannot express them:

         Content-Security-Policy: frame-ancestors 'none';
                                  connect-src 'self' https://<ref>.supabase.co;
                                  img-src 'self' data: blob: https://<ref>.supabase.co
         Strict-Transport-Security: max-age=31536000; includeSubDomains
         X-Content-Type-Options: nosniff
         Referrer-Policy: strict-origin-when-cross-origin

       frame-ancestors is ignored in a meta tag by every browser, so
       clickjacking protection is a header or it does not exist. The same host
       config has to rewrite unknown paths to index.html - the app uses path
       URLs, so a hard refresh on /products/abc 404s without it. -->
  <meta http-equiv="Content-Security-Policy" content="
    script-src 'self' 'wasm-unsafe-eval' https://www.gstatic.com;
    style-src 'self' 'unsafe-inline';
    worker-src 'self' blob:;
    object-src 'none';
    base-uri 'self';
    form-action 'self';
  ">
  <!-- Without this, mobile browsers assume a desktop viewport and scale the
       whole app down, which makes every responsive breakpoint meaningless. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="KASBON - aplikasi kasir digital untuk UMKM Indonesia. Catat penjualan, pantau laba, dan kelola hutang pelanggan.">
  <meta name="theme-color" content="#2563EB">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="KASBON">
  <!-- Square and opaque: iOS rounds a touch icon itself and does not
       composite alpha, so handing it the already-rounded PWA icon produced
       black corners on a home screen. -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">

  <!-- Favicon. The SVG is preferred where supported - it stays crisp on a
       retina tab strip and re-renders at whatever size the browser wants. The
       PNG stays for Safari and anything else that ignores the vector. -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png"/>

  <title>KASBON — Kasir Digital</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Cold-start splash.
     *
     * A Flutter web bundle takes a noticeable moment to download and boot, and
     * until it does the page is a blank white rectangle. On the mobile data
     * this app is built for, that reads as a broken site. Plain CSS with no
     * external requests, so it paints on the first frame.
     *
     * #loading is removed by flutter_bootstrap.js once the app takes over.
     */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #F8FAFC;
    }

    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #2563EB;
    }

    #loading .brand {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    #loading .tagline {
      margin-top: 0.5rem;
      font-size: 0.9rem;
      color: #64748B;
    }

    #loading .spinner {
      margin-top: 1.75rem;
      width: 2rem;
      height: 2rem;
      border: 3px solid #DBEAFE;
      border-top-color: #2563EB;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Respect a reduced-motion preference: keep the indicator, drop the spin. */
    @media (prefers-reduced-motion: reduce) {
      #loading .spinner { animation: none; }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="brand">KASBON</div>
    <div class="tagline">Kasir Bisnis Online</div>
    <div class="spinner"></div>
  </div>

  <!-- Removes the splash on first frame. External rather than inline so the
       CSP above can refuse inline script outright - see splash.js. -->
  <script src="splash.js"></script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
