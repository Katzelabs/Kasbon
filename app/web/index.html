<!DOCTYPE html>
<html lang="id">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!-- Content-Security-Policy: SET IT AT THE HOST, not here.
       ================================================================
       There used to be a <meta http-equiv="Content-Security-Policy"> in this
       spot carrying `script-src 'self' 'wasm-unsafe-eval'
       https://www.gstatic.com`. It was correct about production and it broke
       every `flutter run -d chrome`, which is why it is gone rather than
       relaxed.

       A <meta> CSP applies to whatever loads this file, and debug and release
       bootstrap differently. A release build loads an external
       flutter_bootstrap.js and a service worker - all same-origin src, nothing
       inline, so the policy was satisfied and the deployed app was never
       affected. A debug build hands over to DDC, which loads ~1700 module
       scripts and then calls main() from an *inline* <script>. That inline
       script was refused, main() never ran, and because splash.js only removes
       the spinner on `flutter-first-frame` - an event that needs a frame that
       is never painted - the app sat on the splash screen forever. No Dart
       error, no failed request, nothing in the `flutter run` output: the only
       evidence was one CSP line in the browser console.

       Reproducing that costs an afternoon. A policy that a build step could
       have carried is not worth it, so the whole policy now lives where it can
       also express the parts a meta tag never could:

         Content-Security-Policy: default-src 'self';
                                  script-src 'self' 'wasm-unsafe-eval' https://www.gstatic.com;
                                  style-src 'self' 'unsafe-inline';
                                  img-src 'self' data: blob: https://<ref>.supabase.co;
                                  connect-src 'self' blob: https://<ref>.supabase.co wss://<ref>.supabase.co;
                                  worker-src 'self' blob:;
                                  object-src 'none';
                                  base-uri 'self';
                                  form-action 'self';
                                  frame-ancestors 'none'
         Strict-Transport-Security: max-age=31536000; includeSubDomains
         X-Content-Type-Options: nosniff
         Referrer-Policy: strict-origin-when-cross-origin

       Headers are strictly better here, not a concession: frame-ancestors is
       ignored in a meta tag by every browser, so clickjacking protection is a
       header or it does not exist, and connect-src can finally name the real
       Supabase origin because the host config is per-environment while a meta
       tag is baked into the bundle.

       Two things the same host config must do: rewrite unknown paths to
       index.html (the app uses path URLs, so a hard refresh on /products/abc
       404s without it) while still serving files that exist, or
       /legal/privacy.html gets swallowed too.

       If a bundled default is ever wanted back, inject the meta tag into
       build/web/index.html as a post-build step - never into this file, which
       `flutter run` reads as well. Note that dart2js emits `new Function` under
       some optimisations; `flutter build web --csp` turns that off and is what
       makes a script-src without 'unsafe-eval' safe to promise. -->

  <!-- Style-src note: the splash <style> below stays inline deliberately - it
       has to paint before any extra request could return - so the host policy
       keeps 'unsafe-inline' for styles only. The splash-removal *script* is
       external (splash.js) so that scripts need no such exception. -->
  <!-- Without this, mobile browsers assume a desktop viewport and scale the
       whole app down, which makes every responsive breakpoint meaningless. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="KASBON - aplikasi kasir digital untuk UMKM Indonesia. Catat penjualan, pantau laba, dan kelola hutang pelanggan.">
  <meta name="theme-color" content="#2563EB">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="KASBON">
  <!-- Square and opaque: iOS rounds a touch icon itself and does not
       composite alpha, so handing it the already-rounded PWA icon produced
       black corners on a home screen. -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">

  <!-- Favicon. The SVG is preferred where supported - it stays crisp on a
       retina tab strip and re-renders at whatever size the browser wants. The
       PNG stays for Safari and anything else that ignores the vector. -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png"/>

  <title>KASBON — Kasir Digital</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Cold-start splash.
     *
     * A Flutter web bundle takes a noticeable moment to download and boot, and
     * until it does the page is a blank white rectangle. On the mobile data
     * this app is built for, that reads as a broken site. Plain CSS with no
     * external requests, so it paints on the first frame.
     *
     * #loading is removed by flutter_bootstrap.js once the app takes over.
     */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #F8FAFC;
    }

    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #2563EB;
    }

    #loading .brand {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    #loading .tagline {
      margin-top: 0.5rem;
      font-size: 0.9rem;
      color: #64748B;
    }

    #loading .spinner {
      margin-top: 1.75rem;
      width: 2rem;
      height: 2rem;
      border: 3px solid #DBEAFE;
      border-top-color: #2563EB;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Respect a reduced-motion preference: keep the indicator, drop the spin. */
    @media (prefers-reduced-motion: reduce) {
      #loading .spinner { animation: none; }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="brand">KASBON</div>
    <div class="tagline">Kasir Bisnis Online</div>
    <div class="spinner"></div>
  </div>

  <!-- Removes the splash on first frame. External rather than inline so the
       CSP above can refuse inline script outright - see splash.js. -->
  <script src="splash.js"></script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
